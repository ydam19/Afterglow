{% extends "base.html" %}
{% block title %}{{ '로그인' if mode == 'login' else '가입하기' }} · Afterglow{% endblock %}
{% block content %}

<h1 class="page-title">{{ '다시 만나서 반가워요' if mode == 'login' else '나만의 필름 한 롤' }}</h1>

<form class="entry-form auth-form" method="post">
  <label class="field">
    <span>이메일</span>
    <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
  </label>

  <label class="field">
    <span>비밀번호</span>
    <input type="password" name="password" required minlength="6"
           autocomplete="{{ 'current-password' if mode == 'login' else 'new-password' }}"
           placeholder="6자 이상">
  </label>

  <div class="actions">
    {% if mode == 'login' %}
      <a class="btn-ghost" href="{{ url_for('signup') }}">처음이에요 · 가입하기</a>
      <button class="btn-new" type="submit">로그인</button>
    {% else %}
      <a class="btn-ghost" href="{{ url_for('login') }}">이미 계정이 있어요</a>
      <button class="btn-new" type="submit">가입하기</button>
    {% endif %}
  </div>
</form>

{% endblock %}
