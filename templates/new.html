{% extends "base.html" %}
{% block title %}오늘 기록 · Afterglow{% endblock %}
{% block content %}

<h1 class="page-title">오늘의 한 컷</h1>

<form class="entry-form" method="post" enctype="multipart/form-data" data-sunset-submit>
  <label class="field">
    <span>날짜</span>
    <input type="date" name="entry_date" value="{{ today }}">
  </label>

  <div class="field">
    <span>오늘의 마음</span>
    <div class="mood-pick">
      {% for key, label in MOODS.items() %}
        <label class="mood-opt">
          <input type="radio" name="mood" value="{{ key }}" {{ 'checked' if loop.first }}>
          <span class="bubble">{{ label }}</span>
        </label>
      {% endfor %}
    </div>
  </div>

  <div class="field">
    <span>사진</span>
    <div class="file-field">
      <label class="file-btn">
        사진 선택
        <input type="file" name="image" accept="image/*">
      </label>
      <span class="file-name">선택된 파일 없음</span>
    </div>
  </div>

  <div class="field">
    <span>노을을 본 곳</span>
    <div class="locate">
      <input type="hidden" name="lat">
      <input type="hidden" name="lon">
      <input type="hidden" name="tz">
      <button type="button" class="file-btn" data-locate>📍 지금 위치로 맞추기</button>
      <span class="locate-status" data-locate-status>위치를 남기지 않으면 서울 기준으로 계산해요</span>
    </div>
  </div>

  <label class="field">
    <span>한 줄 일기</span>
    <textarea name="note" rows="3" maxlength="200"
              placeholder="오늘을 한 줄로 남겨보세요..."></textarea>
  </label>

  <div class="actions">
    <a class="btn-ghost" href="{{ url_for('index') }}">취소</a>
    <button class="btn-new" type="submit">기록하기</button>
  </div>
</form>

<!-- 기록하기 → 저무는 빛 연출 (JS가 사진·한 줄을 채워 켬) -->
<div class="dusk-scene" aria-hidden="true" hidden>
  <div class="ds-sky"></div>
  <div class="ds-light"></div>
  <div class="ds-afterglow"></div>
  <div class="ds-sunwrap"><div class="ds-sun"></div></div>
  <div class="ds-horizon"></div>
  <div class="ds-reflect"></div>
  <figure class="ds-frame">
    <div class="ds-photo"><img alt=""></div>
    <figcaption class="ds-note"></figcaption>
  </figure>
  <div class="ds-grain"></div>
  <div class="ds-vignette"></div>
  <p class="ds-caption"><span class="ds-cap-1">오늘이 저물었어요</span><span class="ds-cap-2">여운으로 남겨둘게요</span></p>
  <button type="button" class="ds-skip" tabindex="-1">넘기기</button>
</div>
<p class="sr-only" role="status" aria-live="polite" data-sunset-live></p>

{% endblock %}
